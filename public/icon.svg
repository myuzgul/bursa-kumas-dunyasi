<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528" />
      <stop offset="50%" stop-color="#060B14" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="25%" stop-color="#E6C280" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#6E4A0C" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="100" height="100" rx="22" fill="url(#bgNavy)" />
  <rect width="100" height="100" rx="22" fill="url(#goldShine)" />

  <!-- Borders -->
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#goldPrimary)" stroke-width="1.8" stroke-opacity="0.9" />
  <rect x="5.5" y="5.5" width="89" height="89" rx="17" stroke="url(#goldPrimary)" stroke-width="0.8" stroke-dasharray="3 2" stroke-opacity="0.5" />

  <!-- Corner Gems -->
  <circle cx="10" cy="10" r="1.5" fill="url(#goldPrimary)" />
  <circle cx="90" cy="10" r="1.5" fill="url(#goldPrimary)" />
  <circle cx="10" cy="90" r="1.5" fill="url(#goldPrimary)" />
  <circle cx="90" cy="90" r="1.5" fill="url(#goldPrimary)" />

  <!-- Monogram B & K -->
  <path
    d="M32 23 H47 C57 23, 64 28, 64 36 C64 42, 59 47, 51 49 C62 52, 68 59, 68 68 C68 77, 59 82, 47 82 H32 Z"
    fill="none"
    stroke="url(#goldPrimary)"
    stroke-width="5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <path d="M40 33 H46 C51 33, 54 35, 54 39 C54 43, 51 45, 46 45 H40 Z" fill="#0B1528" stroke="url(#goldPrimary)" stroke-width="2.5" />
  <path d="M40 55 H47 C53 55, 57 58, 57 63 C57 68, 53 71, 47 71 H40 Z" fill="#0B1528" stroke="url(#goldPrimary)" stroke-width="2.5" />
  <path d="M51 49 L74 24 M51 49 L75 79" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  <path d="M24 50 Q50 18 76 50 Q50 82 24 50" fill="none" stroke="url(#goldPrimary)" stroke-width="1.2" stroke-opacity="0.4" />
  <polygon points="76,50 78,46 82,50 78,54" fill="url(#goldPrimary)" />
  <polygon points="24,50 22,46 18,50 22,54" fill="url(#goldPrimary)" />
</svg>
